<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon blog de voyage</title>
    <!-- FontAwesome pour les icônes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
        }


        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #fff;
            border: 2px solid #cc8b65;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 2.8rem;
            color: #000;
            margin: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #000;
            font-weight: bold;
            border: 1px solid #000;
            padding: 6px 18px;
            border-radius: 5px;
            background: #fff;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        nav ul li a:hover {
            background: #eee;
        }

        .banner {
            position: relative;
            margin-bottom: 20px;
            border: 2px solid #cc8b65;
        }

        .banner img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .banner-text {
            position: absolute;
            bottom: 15px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 18px;
            border-radius: 4px;
            font-size: 0.9rem;
        }


        .main-content {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }


        article {
            flex: 2;
            background-color: #fefae0;
            border: 2px solid #cc8b65;
            padding: 20px 25px;
        }

        article h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }

        article p {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        aside {
            flex: 1;
            background-color: #6c757d;
            border: 2px solid #cc8b65;
            padding: 20px;
            color: #fff;
            text-align: center;
        }

        aside h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .avatar img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #fff;
            color: #6c757d;
            border-radius: 5px;
            font-size: 1.2rem;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .social-icons a:hover {
            background: #cc8b65;
            color: #fff;
        }


        footer {
            display: flex;
            justify-content: space-between;
            background: #fff;
            border: 2px solid #cc8b65;
            padding: 20px 30px;
        }

        footer h3 {
            margin-bottom: 12px;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .photos {
            display: flex;
            gap: 8px;
        }

        .photos img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        footer ul {
            list-style: none;
        }

        footer ul li {
            margin-bottom: 4px;
            font-size: 0.95rem;
        }


        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-content {
                flex-direction: column;
            }
            footer {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo"><h1>Logo</h1></div>
        <nav>
            <ul>
                <li><a href="#">ACCUEIL</a></li>
                <li><a href="#">BLOG</a></li>
                <li><a href="#">CV</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <!-- BANNIÈRE -->
    <div class="banner">
        <img src="https://picsum.photos/1100/250?random=1" alt="Pont de San Francisco">
        <p class="banner-text">Retour sur mes vacances aux États-Unis...</p>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <div class="main-content">
        <!-- Article -->
        <article>
            <h2>JE SUIS UN GRAND VOYAGEUR</h2>
            <p>paragraphe 1</p>
            <p>paragraphe 2</p>
            <p>paragraphe 3</p>
        </article>

        <!-- Aside -->
        <aside>
            <h2>À PROPOS DE L'AUTEUR</h2>
            <div class="avatar">
                <img src="https://i.pravatar.cc/150?img=3" alt="Avatar">
            </div>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-vimeo-v"></i></a>
                <a href="#"><i class="fab fa-flickr"></i></a>
                <a href="#"><i class="fas fa-rss"></i></a>
            </div>
        </aside>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-left">
            <h3>MES PHOTOS</h3>
            <div class="photos">
                <img src="https://picsum.photos/70/70?random=2" alt="photo1">
                <img src="https://picsum.photos/70/70?random=3" alt="photo2">
                <img src="https://picsum.photos/70/70?random=4" alt="photo3">
            </div>
        </div>
        <div class="footer-right">
            <h3>MES AMIS</h3>
            <ul>
                <li>Pseudo 1</li>
                <li>Pseudo 2</li>
                <li>Pseudo 3</li>
            </ul>
        </div>
    </footer>

</body>
</html>
